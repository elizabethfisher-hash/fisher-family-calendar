<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar 2026–2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Style+Script&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', Arial, sans-serif; background: #eee; }

    .page {
      width: 1150px;
      margin: 20px auto;
      background: white;
    }

    .calendar { border: 2.5px dashed #4AADAD; }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px 6px;
      border-bottom: 2px solid #222;
    }

    .cal-title { display: flex; align-items: baseline; gap: 12px; }

    .cal-year  { font-family: 'Poppins', sans-serif; font-size: 30px; font-weight: 400; color: #4AADAD; line-height: 1; }
    .cal-month { font-family: 'Style Script', cursive; font-size: 46px; font-weight: 400; color: #000; line-height: 1; }

    .cal-info { text-align: right; font-size: 11.5px; line-height: 1.7; color: #222; }

    .cal-grid { width: 100%; border-collapse: collapse; table-layout: fixed; }

    .cal-grid th {
      text-align: center;
      padding: 5px 0;
      border: 1px solid #999;
      font-size: 13px;
      font-weight: bold;
    }

    .cal-grid td {
      vertical-align: top;
      border: 1px solid #ccc;
      height: 132px;
      padding: 4px 5px;
    }

    .day-num   { font-size: 12px; color: #222; }
    .day-num.other { color: #bbb; }

    .holiday   { font-size: 10px; color: #222; margin-top: 1px; font-weight: bold; }
    .holiday.noschool { font-size: 8px; white-space: nowrap; }
    .holiday.requested { color: #b5006e; background: #fde7f3; border-radius: 4px; padding: 1px 3px; display: inline-block; }
    .conf      { font-size: 10px; color: #222; margin-top: 1px; white-space: nowrap; }
    .m-work    { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 10px; color: #0070C0; }
    .gym       { font-size: 10px; color: #222; margin-top: auto; padding-top: 6px; }

    /* push gymnastics to bottom */
    .cal-grid td { display: table-cell; position: relative; }
    .gym-wrap {
      position: absolute;
      bottom: 4px;
      left: 5px;
      font-size: 10px;
      color: #222;
    }

    .banner-strip { position: relative; width: 100%; height: 56px; overflow: hidden; }

    @media print {
      body { background: white; }
      .page { width: 100%; margin: 0; page-break-after: always; }
      .cal-grid td { height: 96px; }
    }

    @page { size: landscape; margin: 0.25in; }
  </style>
</head>

        const p = String(r.date).split('-');
        if (p.length < 3) return;
        const key = parseInt(p[0],10)+'-'+parseInt(p[1],10)+'-'+parseInt(p[2],10);
        const label = "📌 "+(r.title||'Event') + (r.time? " ("+r.time+")":"") + (r.by? " — "+r.by:"");

    function nthWeekday(year, month, dow, n) {
      // dow: 0=Sun…6=Sat, n: 1-based
      const first = new Date(year, month, 1);
      const delta = (dow - first.getDay() + 7) % 7;
      return new Date(year, month, 1 + delta + 7 * (n - 1));
    }

    function lastWeekday(year, month, dow) {
      const last = new Date(year, month + 1, 0);
      const delta = (last.getDay() - dow + 7) % 7;
      return new Date(year, month, last.getDate() - delta);
    }

    function easter(year) {
      const a = year % 19, b = Math.floor(year/100), c = year % 100;
      const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
      const g = Math.floor((b-f+1)/3);
      const h = (19*a+b-d-g+15) % 30;
      const i = Math.floor(c/4), k = c % 4;
      const l = (32+2*e+2*i-h-k) % 7;
      const m = Math.floor((a+11*h+22*l)/451);
      const mo = Math.floor((h+l-7*m+114)/31) - 1;
      const dy = ((h+l-7*m+114) % 31) + 1;
      return new Date(year, mo, dy);
    }

    function sameDay(a, b) {
      return a.getFullYear()===b.getFullYear() &&
             a.getMonth()===b.getMonth() &&
             a.getDate()===b.getDate();

    function getEvents(year, month, day) {
      const d = new Date(year, month, day);

      const key = `${month+1}-${day}`;
      if (FIXED[key]) labels.push(FIXED[key]);
      const y = year;
      if (sameDay(d, easter(y)))                       labels.push("🐣 Easter");
      if (sameDay(d, nthWeekday(y, 0, 1, 3)))          labels.push("🕊️ No School - MLK Day");
      if (sameDay(d, nthWeekday(y, 1, 1, 3)))          labels.push("🏛️ No School - Presidents' Day");
      if (sameDay(d, lastWeekday(y, 4, 1)))            labels.push("🌺 No School - Memorial Day");
      if (sameDay(d, nthWeekday(y, 4, 0, 2)))          labels.push("💐 Mother's Day");
      if (sameDay(d, nthWeekday(y, 5, 0, 3)))          labels.push("👔 Father's Day");
      if (sameDay(d, nthWeekday(y, 8, 1, 1)))          labels.push("🔨 No School - Labor Day");
      if (sameDay(d, nthWeekday(y, 9, 1, 2)))          labels.push("🪶 No School - Indigenous Peoples' Day");
      if (sameDay(d, nthWeekday(y, 10, 4, 4)))         labels.push("🦃 Thanksgiving");
      const schoolKey = `${year}-${month+1}-${day}`;
      if (SCHOOL_OFF[schoolKey]) labels.push(SCHOOL_OFF[schoolKey]);
      if (APPROVED[schoolKey]) APPROVED[schoolKey].forEach(l => labels.push(l));
      return labels;

    function getMonthBanner(month) {
      const {bg, it} = BANNERS[month];
      const H = 56; // strip height in px
      const items = it.map(({e,x,y,s,o}) => {
        const left = (x / 1050 * 100).toFixed(2);   // full-width spread, no distortion
        const fs   = (s * H / 80).toFixed(1);        // scale emoji to strip height
        const top  = (y * H / 80 - fs).toFixed(1);   // baseline-ish placement
        return `<span style="position:absolute;left:${left}%;top:${top}px;font-size:${fs}px;opacity:${o};line-height:1;user-select:none;font-family:'Apple Color Emoji','Segoe UI Emoji',sans-serif">${e}</span>`;
      }).join('');
      return `<div class="banner-strip" style="background:${bg}">${items}</div>`;
    }

    // ── Calendar builder ──────────────────────────────────────────────────────

    function daysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function buildMonth(year, month) {
      const firstDow    = new Date(year, month, 1).getDay(); // 0=Sun

      const prevMonth   = month === 0 ? 11 : month - 1;
      const prevYear    = month === 0 ? year - 1 : year;
      const dimPrev     = daysInMonth(prevYear, prevMonth);

    </div>
    <div class="cal-info">
      Jack school schedule: M/T/Th/F 8:00-2:35 (Weds: 8:00-1:15)<br>
      Emily school schedule: M/T/Th/F 8:00-2:30 (Weds: 8:00-1:10)
    </div>
  </div>
  <table class="cal-grid"><tr>`;

      for (const d of DAY_NAMES) html += `<th>${d}</th>`;
      html += `</tr>`;

      for (let r = 0; r < rows; r++) {
        html += `<tr>`;
        for (let c = 0; c < 7; c++) {
          const idx = r * 7 + c;
          let dy, dy_year, dy_month, other;
          if (idx < firstDow) {
            dy = dimPrev - firstDow + idx + 1;
            dy_year = prevYear; dy_month = prevMonth; other = true;
          } else if (idx < firstDow + dim) {
            dy = idx - firstDow + 1;
            dy_year = year; dy_month = month; other = false;
          } else {
            dy = idx - firstDow - dim + 1;
            dy_year = nextYear; dy_month = nextMonth; other = true;
          }

          const isWed  = (c === 3);
          const work   = !other && isWork(dy_year, dy_month, dy);
          const events = other ? [] : getEvents(dy_year, dy_month, dy);

          const numClass = other ? 'day-num other' : 'day-num';
          const workHtml = work ? `<div class="m-work">M Work</div>` : '';
          const evtHtml  = events.map(ev =>
            /^📌/.test(ev)
              ? `<div class="holiday requested">${ev}</div>`
              : /No School/.test(ev)
                ? `<div class="holiday noschool">${ev}</div>`
                : `<div class="holiday">${ev}</div>`
          ).join('');
          const confKey  = `${dy_year}-${dy_month+1}-${dy}`;
          const confHtml = (!other && CONFERENCES[confKey])
            ? `<div class="conf">${CONFERENCES[confKey]}</div>` : '';
          const gymHtml  = (isWed && !other)
            ? `<div class="gym-wrap">Gymnastics @ 4:30</div>` : '';

          html += `<td>
            <span class="${numClass}">${dy}</span>${evtHtml}${workHtml}${confHtml}${gymHtml}
          </td>`;
        }
        html += `</tr>`;
      }

      html += `</table></div></div>`;
      return html;
    }

    function renderCalendar() {
      let out = '';
      for (let y = 2026; y <= 2027; y++) {
        const ms = y === 2026 ? 7 : 0;
        for (let m = ms; m < 12; m++) out += buildMonth(y, m);
      }
      document.getElementById('app').innerHTML = out;
    }
    renderCalendar();

    // pull in approved event requests, then re-render
    (function loadApproved() {
      if (!REQUEST_ENDPOINT || REQUEST_ENDPOINT.indexOf('http') !== 0) return;
      const s = document.createElement('script');
      s.src = REQUEST_ENDPOINT + (REQUEST_ENDPOINT.indexOf('?') >= 0 ? '&' : '?') + "feed=events&callback=__calFeed";
      s.onerror = function () {};
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
